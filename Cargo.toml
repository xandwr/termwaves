[package]
name = "termwaves"
version = "0.1.0"
edition = "2024"

# The library is the signal path only: PipeWire capture, history, FFT, spectrum.
[dependencies]
pipewire = "0.10.0"
ringbuf = "0.5.0"

# The terminal UI lives in examples/, so its deps are dev-only — the lib itself
# pulls in no rendering stack.
[dev-dependencies]
ratatui = "0.29"
crossterm = "0.28"

# The terrain client. `examples/terrain/` is a multi-file example, so point Cargo
# at its entrypoint explicitly. Run with `cargo run --example terrain`.
[[example]]
name = "terrain"
path = "examples/terrain/main.rs"
