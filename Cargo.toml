# Two pieces: the `termwaves` core library (audio capture + DSP) and the
# `termwaves-client` terminal app you actually run. The client depends on the
# lib by path; the lib depends on neither the client nor any UI stack.
[workspace]
resolver = "3"
members = ["crates/termwaves", "client"]
# Bare `cargo run` / `cargo build` from the root targets the client app.
default-members = ["client"]

# Versions shared by both crates, pinned once here.
[workspace.dependencies]
pipewire = "0.10.0"
ringbuf = "0.5.0"
ratatui = "0.29"
crossterm = "0.28"

[workspace.package]
version = "0.1.0"
edition = "2024"
